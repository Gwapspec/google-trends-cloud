[metadata]
name = google-trends-cloud
version = 0.1.0
description = Google Trends interest over time without 429 errors: a drop-in for pytrends' TrendReq, up to 200 keywords on one scale, with error bars.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Honest Data
url = https://github.com/Gwapspec/google-trends-cloud
project_urls =
    Hosted tool = https://apify.com/honestdata/google-trends-one-scale
keywords = google trends, pytrends, google-trends-api, 429, seo, keyword research, apify
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Topic :: Scientific/Engineering :: Information Analysis

[options]
packages = google_trends_cloud
python_requires = >=3.8

[options.extras_require]
pandas = pandas
